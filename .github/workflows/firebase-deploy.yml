name: Firebase Deploy

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, closed]

jobs:
  # PR 생성/업데이트 시 빌드 테스트만 실행
  test-build-android:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (Test)
        run: flutter build apk --release

  # test-build-ios:
  #   runs-on: macos-latest
  #   if: github.event_name == 'pull_request'

  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Setup Flutter
  #       uses: subosito/flutter-action@v2
  #       with:
  #         flutter-version: "3.27.0"
  #         channel: "stable"

  #     - name: Install Flutter dependencies
  #       run: flutter pub get

  #     - name: Install CocoaPods dependencies
  #       working-directory: ios
  #       run: |
  #         pod install

  #     - name: Build iOS IPA (Test)
  #       continue-on-error: true
  #       run: |
  #         flutter build ipa --release --no-codesign || echo "iOS 빌드 실패: 코드 서명이 필요합니다"

  # develop 브랜치에 push 시 배포 실행 (PR 머지 포함)
  deploy-firestore:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Firebase CLI and jq
        run: |
          npm install -g firebase-tools
          sudo apt-get update && sudo apt-get install -y jq

      - name: Deploy Firestore Rules and Indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only firestore:rules,firestore:indexes --project memory-app-server

  deploy-android:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install Firebase CLI and jq
        run: |
          npm install -g firebase-tools
          sudo apt-get update && sudo apt-get install -y jq

      - name: Verify google-services.json exists
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "❌ android/app/google-services.json 파일이 없습니다"
            echo "Firebase Console에서 다운로드하여 저장소에 추가하세요"
            exit 1
          fi
          
          # JSON 유효성 검사
          if ! jq empty android/app/google-services.json 2>/dev/null; then
            echo "❌ google-services.json 파일이 유효한 JSON이 아닙니다"
            exit 1
          fi
          
          echo "✅ google-services.json 파일 확인 완료"

      - name: Setup Debug Keystore and Get SHA-1
        run: |
          mkdir -p ~/.android
          
          # Secrets에 저장된 keystore가 있으면 사용, 없으면 새로 생성
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "=== 기존 debug keystore 복원 ==="
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            echo "✅ 기존 keystore를 사용합니다"
          else
            echo "=== 새 debug keystore 생성 ==="
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "✅ 새 keystore 생성 완료"
          fi
          
          # SHA-1 지문 추출 (콜론 제거)
          SHA1_RAW=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>&1 | grep -i "SHA1:" | head -1 | sed 's/.*SHA1: *//' | tr -d '[:space:]' | tr -d ':')
          SHA1=$(echo "$SHA1_RAW" | tr '[:lower:]' '[:upper:]')
          
          if [ -n "$SHA1" ]; then
            echo ""
            echo "=========================================="
            echo "=== SHA-1 Fingerprint ==="
            echo "$SHA1"
            echo "=========================================="
            echo ""
            echo "⚠️ 중요: 이 SHA-1이 Firebase Console에 등록되어 있는지 확인하세요!"
            echo "Firebase Console → 프로젝트 설정 → 일반 → 내 앱 → Android 앱 → SHA 인증서 지문"
            echo ""
            echo "현재 google-services.json에 등록된 SHA-1:"
            echo "- 38DFE83EBBA8896122313D96066662842BA6884F"
            echo "- 95ED528E9C3426F14E1AA62643B349FC47EA83F1"
            echo ""
            if [ -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
              echo "⚠️ 경고: DEBUG_KEYSTORE_BASE64가 설정되지 않아 매번 새로운 keystore가 생성됩니다."
              echo "같은 keystore를 재사용하려면 GitHub Secrets에 DEBUG_KEYSTORE_BASE64를 추가하세요."
            fi
            echo ""
            echo "SHA1_FINGERPRINT=$SHA1" >> $GITHUB_ENV
          else
            echo "❌ SHA-1 지문을 찾을 수 없습니다."
            exit 1
          fi

      - name: Verify google-services.json exists
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "❌ android/app/google-services.json 파일이 없습니다"
            echo "Firebase Console에서 다운로드하여 저장소에 추가하세요"
            exit 1
          fi
          
          # JSON 유효성 검사
          if ! jq empty android/app/google-services.json 2>/dev/null; then
            echo "❌ google-services.json 파일이 유효한 JSON이 아닙니다"
            exit 1
          fi
          
          echo "✅ google-services.json 파일 확인 완료"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.HOME }}/.android/debug.keystore
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: androiddebugkey
          ANDROID_KEY_PASSWORD: android
        run: flutter build apk --release

      - name: Verify APK Signature and SHA-1/SHA-256
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "=== APK 서명 정보 확인 ==="
            # APK에서 서명 인증서 정보 추출
            unzip -q -o "$APK_PATH" -d /tmp/apk_extract 2>/dev/null || true
            if [ -f /tmp/apk_extract/META-INF/*.RSA ] || [ -f /tmp/apk_extract/META-INF/*.DSA ] || [ -f /tmp/apk_extract/META-INF/*.EC ]; then
              CERT_FILE=$(find /tmp/apk_extract/META-INF -name "*.RSA" -o -name "*.DSA" -o -name "*.EC" | head -1)
              if [ -n "$CERT_FILE" ]; then
                echo "서명 인증서 파일: $CERT_FILE"
                echo ""
                echo "=== APK의 인증서 정보 ==="
                CERT_INFO=$(keytool -printcert -file "$CERT_FILE")
                echo "$CERT_INFO"
                echo ""
                
                # SHA-1 추출 (콜론 제거)
                APK_SHA1_RAW=$(echo "$CERT_INFO" | grep -i "SHA1:" | head -1 | sed 's/.*SHA1: *//' | tr -d '[:space:]' | tr -d ':')
                APK_SHA1=$(echo "$APK_SHA1_RAW" | tr '[:lower:]' '[:upper:]')
                
                # SHA-256 추출 (콜론 제거)
                APK_SHA256_RAW=$(echo "$CERT_INFO" | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d '[:space:]' | tr -d ':')
                APK_SHA256=$(echo "$APK_SHA256_RAW" | tr '[:lower:]' '[:upper:]')
                
                echo "=== 비교 ==="
                echo "APK SHA-1: $APK_SHA1"
                echo "Keystore SHA-1: ${{ env.SHA1_FINGERPRINT }}"
                if [ "$APK_SHA1" = "${{ env.SHA1_FINGERPRINT }}" ]; then
                  echo "✅ SHA-1 일치!"
                else
                  echo "❌ SHA-1 불일치!"
                fi
                echo ""
                echo "APK SHA-256: $APK_SHA256"
                
                # Keystore의 SHA-256도 추출
                KEYSTORE_SHA256_RAW=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>&1 | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d '[:space:]' | tr -d ':')
                KEYSTORE_SHA256=$(echo "$KEYSTORE_SHA256_RAW" | tr '[:lower:]' '[:upper:]')
                echo "Keystore SHA-256: $KEYSTORE_SHA256"
                if [ "$APK_SHA256" = "$KEYSTORE_SHA256" ]; then
                  echo "✅ SHA-256 일치!"
                else
                  echo "❌ SHA-256 불일치!"
                fi
              fi
            else
              echo "⚠️ APK에서 서명 인증서를 찾을 수 없습니다"
            fi
            rm -rf /tmp/apk_extract
          else
            echo "❌ APK 파일을 찾을 수 없습니다: $APK_PATH"
          fi

      - name: Deploy to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app 1:629900837240:android:2d4dfde780ed14e424c88d \
            --groups "testers" \
            --project memory-app-server

