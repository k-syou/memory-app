  #         flutter build ipa --release --no-codesign || echo "iOS 빌드 실패: 코드 서명이 필요합니다"

  # develop 브랜치에 push 시 배포 실행 (PR 머지 포함)
  deploy-firestore:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules and Indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only firestore:rules,firestore:indexes --project memory-app-server

  deploy-android:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Setup Debug Keystore and Get SHA-1
        run: |
          mkdir -p ~/.android
          
          # Secrets에 저장된 keystore가 있으면 사용, 없으면 새로 생성
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "=== 기존 debug keystore 복원 ==="
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            echo "✅ 기존 keystore를 사용합니다"
          else
            echo "=== 새 debug keystore 생성 ==="
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "✅ 새 keystore 생성 완료"
          fi
          
          # SHA-1 지문 추출 (콜론 제거)
          SHA1_RAW=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>&1 | grep -i "SHA1:" | head -1 | sed 's/.*SHA1: *//' | tr -d '[:space:]' | tr -d ':')
          SHA1=$(echo "$SHA1_RAW" | tr '[:lower:]' '[:upper:]')
          
          if [ -n "$SHA1" ]; then
            echo "=== Found SHA-1 Fingerprint ==="
            echo "$SHA1"
            echo "=============================="
            echo "SHA1_FINGERPRINT=$SHA1" >> $GITHUB_ENV
          else
            echo "❌ SHA-1 지문을 찾을 수 없습니다."
            exit 1
          fi

      - name: Register SHA-1 to Firebase and Download google-services.json
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # Firebase 로그인
          echo "$FIREBASE_TOKEN" | firebase login:ci --token-stdin
          
          APP_ID="1:629900837240:android:2d4dfde780ed14e424c88d"
          PROJECT_ID="memory-app-server"
          SHA1="${{ env.SHA1_FINGERPRINT }}"
          
          echo "=== SHA-1 지문을 Firebase에 등록 ==="
          # Firebase Management API로 SHA-1 등록
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID/androidApps/$APP_ID/sha" \
            -H "Authorization: Bearer $FIREBASE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"shaHash\": \"$SHA1\"}" 2>&1) || true
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ SHA-1 지문이 Firebase에 등록되었습니다"
          elif echo "$BODY" | grep -q "already exists"; then
            echo "ℹ️ SHA-1 지문이 이미 등록되어 있습니다"
          else
            echo "⚠️ SHA-1 지문 등록 실패 (HTTP $HTTP_CODE)"
            echo "응답: $BODY"
            echo "계속 진행합니다..."
          fi
          
          echo ""
          echo "=== google-services.json 다운로드 ==="
          # Firebase CLI로 google-services.json 생성
          firebase apps:sdkconfig android \
            --app $APP_ID \
            --project $PROJECT_ID \
            --out android/app/google-services.json || {
            echo "⚠️ google-services.json 자동 생성 실패"
            echo "Firebase Console에서 수동으로 다운로드하세요"
            exit 1
          }
          
          echo "✅ google-services.json 다운로드 완료"

      - name: Build Android APK
        run: flutter build apk --release

      - name: Deploy to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app 1:629900837240:android:2d4dfde780ed14e424c88d \
            --groups "testers" \
            --project memory-app-server

