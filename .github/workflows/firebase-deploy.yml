name: Firebase Deploy

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, closed]

jobs:
  # PR 생성/업데이트 시 빌드 테스트만 실행
  test-build-android:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (Test)
        run: flutter build apk --release

  test-build-ios:
    runs-on: macos-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          pod install

      - name: Build iOS IPA (Test)
        continue-on-error: true
        run: |
          flutter build ipa --release --no-codesign || echo "iOS 빌드 실패: 코드 서명이 필요합니다"

  # develop 브랜치에 push 시 배포 실행 (PR 머지 포함)
  deploy-firestore:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules and Indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only firestore:rules,firestore:indexes --project memory-app-server

  deploy-android:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Get SHA-1 fingerprint and register to Firebase
        run: |
          cd android
          chmod +x gradlew || true
          ./gradlew signingReport 2>&1 | tee /tmp/signing_report.txt
          
          # SHA-1 지문 추출 (콜론 제거)
          SHA1_RAW=$(grep -i "SHA1:" /tmp/signing_report.txt | head -1 | sed 's/.*SHA1: *//' | tr -d '[:space:]')
          SHA1=$(echo "$SHA1_RAW" | tr '[:lower:]' '[:upper:]')
          
          if [ -n "$SHA1" ]; then
            echo "=== Found SHA-1 Fingerprint ==="
            echo "$SHA1"
            echo "=============================="
            
            # Firebase Management API로 자동 등록
            APP_ID="1:629900837240:android:2d4dfde780ed14e424c88d"
            PROJECT_ID="memory-app-server"
            
            curl -X POST \
              "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID/androidApps/$APP_ID/sha" \
              -H "Authorization: Bearer ${{ secrets.FIREBASE_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"shaHash\": \"$SHA1\"}" \
              2>&1 || echo "⚠️ SHA-1 지문 자동 등록 실패. 수동으로 Firebase Console에 등록해주세요: $SHA1"
          else
            echo "=== SHA-1 Fingerprint Not Found ==="
            echo "SHA-1 지문을 찾을 수 없습니다."
            echo "전체 출력 (마지막 30줄):"
            tail -30 /tmp/signing_report.txt
          fi

      - name: Build Android APK
        run: flutter build apk --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app 1:629900837240:android:2d4dfde780ed14e424c88d \
            --groups "testers" \
            --project memory-app-server

  deploy-ios:
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          pod install

      - name: Setup Apple Developer Certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Setup Provisioning Profile
        if: env.APPLE_PROVISIONING_PROFILE_BASE64 != ''
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build iOS IPA
        continue-on-error: true
        run: |
          flutter build ipa --release || echo "iOS 빌드 실패: 코드 서명이 필요합니다"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase App Distribution
        if: success()
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -f build/ios/ipa/*.ipa ]; then
            firebase appdistribution:distribute build/ios/ipa/*.ipa \
              --app 1:629900837240:ios:f7b50a73a0bf441f24c88d \
              --groups "testers" \
              --project memory-app-server
          else
            echo "IPA 파일이 없습니다. 코드 서명이 필요합니다."
          fi
